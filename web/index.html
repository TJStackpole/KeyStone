<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KEYSTONE — Incident Command</title>
    <!-- Warm the connections that gate a usable, sharp map: OSM basemap tiles
         (keyless first paint) and Google photorealistic tiles (root.json +
         every tile). Both are fetched CORS-anonymous by Cesium, so the
         crossorigin attribute is required for socket reuse. -->
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="preconnect" href="https://tile.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://data.cityofnewyork.us" />
    <link rel="dns-prefetch" href="https://geosearch.planninglabs.nyc" />
    <!-- Self-hosted variable fonts: no render-blocking cross-origin CSS, and
         typography survives a dead demo-floor network. -->
    <link rel="preload" href="/fonts/Inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/Inter-var.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('/fonts/JetBrainsMono-var.woff2') format('woff2');
        font-weight: 100 800;
        font-style: normal;
        font-display: swap;
      }
      html, body, #root { margin: 0; height: 100%; background: #0a0e14; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
