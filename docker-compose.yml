# KEYSTONE infrastructure.
# Phases 1-2 need no containers — `docker compose up -d` is required from Phase 3 onward.

services:
  # Phase 3 — real open-source TAK server (taky). All unit positions round-trip
  # through this as genuine Cursor-on-Target XML; real ATAK/iTAK clients connect
  # to port 8087 and appear on the dashboard exactly like simulated units.
  # See README "TAK server selection" for why taky rather than OpenTAKServer /
  # FreeTAKServer (both shipped broken as of 2026-07; failure log documented).
  takserver:
    build: ./takserver
    container_name: watchtower-takserver
    restart: unless-stopped
    ports:
      - "8087:8087"   # CoT TCP (plain) — ATAK clients + KEYSTONE backend

  # Phase 6 — RTSP in -> WebRTC/HLS out video gateway.
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: watchtower-mediamtx
    restart: unless-stopped
    environment:
      # Advertise reachable ICE candidates (the container IP is useless to the
      # browser) and offer ICE over TCP 8189 alongside UDP.
      MTX_WEBRTCADDITIONALHOSTS: 127.0.0.1,localhost
      MTX_WEBRTCLOCALTCPADDRESS: :8189
    ports:
      - "8554:8554"     # RTSP ingest
      - "8888:8888"     # HLS
      - "8889:8889"     # WebRTC (WHEP)
      - "8189:8189/udp" # WebRTC ICE (UDP)
      - "8189:8189"     # WebRTC ICE (TCP)

  # Phase 6 — demo stream source: generates 4 synthetic placeholder clips
  # (no real footage) and loops them into MediaMTX as RTSP. A real drone is a
  # config swap: publish its RTSP to rtsp://<host>:8554/drone1 instead.
  streams:
    image: linuxserver/ffmpeg:latest
    container_name: watchtower-streams
    restart: unless-stopped
    depends_on:
      - mediamtx
    entrypoint: ["/bin/sh", "/streams.sh"]
    volumes:
      - ./video/streams.sh:/streams.sh:ro
      - streams-clips:/clips

  # Phase 7 — faster-whisper transcription sidecar. Default: transcribes the
  # bundled FDNY-style recording (synthetic TTS, no real radio content) and
  # replays it as-if-live. Set BROADCASTIFY_URL in .env for rolling-chunk
  # transcription of an authenticated live stream instead.
  whisper:
    build: ./whisper
    container_name: watchtower-whisper
    restart: unless-stopped
    environment:
      BROADCASTIFY_URL: ${BROADCASTIFY_URL:-}
    ports:
      - "8765:8765"   # transcript WebSocket (consumed by the backend)
    volumes:
      - ./assets/audio:/audio:ro
      - whisper-models:/models

volumes:
  streams-clips:
  whisper-models:
